<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2efe7">
    <title>Wish</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#conversation">跳到对话</a>
    <div class="app-shell" id="app-shell">
      <aside class="session-rail" id="session-rail" aria-label="会话">
        <header class="brand-block">
          <div class="brand-mark" aria-hidden="true">W</div>
          <div>
            <p class="eyebrow">LOCAL AGENT</p>
            <h1>Wish</h1>
          </div>
          <span class="connection-dot" id="connection-dot" title="正在连接"></span>
        </header>

        <button class="new-session-button" id="new-session-button" type="button">
          <span aria-hidden="true">＋</span>
          新会话
        </button>

        <div class="session-filter" role="group" aria-label="会话筛选">
          <button class="filter-chip is-active" data-session-status="active" type="button">进行中</button>
          <button class="filter-chip" data-session-status="archived" type="button">已归档</button>
        </div>

        <nav class="session-list" id="session-list" aria-live="polite"></nav>

        <footer class="rail-footer">
          <span id="agent-name">agent · —</span>
          <span id="server-state">connecting</span>
        </footer>
      </aside>

      <main class="conversation-pane" id="conversation">
        <header class="conversation-header">
          <button class="icon-button mobile-only" id="toggle-sessions" type="button" aria-label="打开会话列表">☰</button>
          <div class="conversation-heading">
            <div class="title-line">
              <h2 id="session-title">选择一个会话</h2>
              <span class="status-pill" id="session-status" hidden></span>
            </div>
            <p id="session-scope">创建会话后即可开始工作</p>
          </div>
          <div class="header-actions">
            <button class="text-button" id="rename-session" type="button" hidden>重命名</button>
            <button class="text-button danger-text" id="archive-session" type="button" hidden>归档</button>
            <button class="icon-button" id="toggle-inspector" type="button" aria-label="打开运行详情">◎</button>
          </div>
        </header>

        <section class="empty-state" id="empty-state">
          <div class="empty-emblem" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p class="eyebrow">A QUIET WORKSPACE</p>
          <h2>从一个具体愿望开始</h2>
          <p>Wish 会把对话事实保存到 Session，把运行控制交给 Runtime。</p>
          <button class="primary-button" id="empty-new-session" type="button">创建第一个会话</button>
        </section>

        <section class="message-scroll" id="message-scroll" hidden aria-label="对话历史">
          <div class="message-column" id="message-list"></div>
          <div class="live-region" id="live-region" aria-live="polite"></div>
        </section>

        <form class="composer" id="composer" hidden>
          <label class="sr-only" for="composer-input">消息</label>
          <textarea id="composer-input" rows="1" maxlength="200000" placeholder="告诉 Wish 你想完成什么…"></textarea>
          <div class="composer-footer">
            <div class="composer-context">
              <span class="run-indicator" id="run-indicator"><i></i><span>准备就绪</span></span>
              <span id="composer-hint">Ctrl / ⌘ + Enter 发送</span>
            </div>
            <div class="composer-actions" id="idle-actions">
              <button class="primary-button" id="start-run" type="submit">开始</button>
            </div>
            <div class="composer-actions" id="active-actions" hidden>
              <button class="secondary-button" id="send-steer" type="button">送入下一步</button>
              <button class="secondary-button" id="send-follow-up" type="button">排队新回合</button>
              <button class="stop-button" id="abort-run" type="button" aria-label="终止当前运行">■</button>
            </div>
          </div>
        </form>
      </main>

      <aside class="inspector-pane" id="inspector-pane" aria-label="运行详情">
        <header class="inspector-header">
          <div>
            <p class="eyebrow">RUN DESK</p>
            <h2>运行详情</h2>
          </div>
          <button class="icon-button inspector-close" id="close-inspector" type="button" aria-label="关闭运行详情">×</button>
        </header>

        <section class="inspector-section" aria-labelledby="run-section-title">
          <div class="section-heading">
            <h3 id="run-section-title">当前运行</h3>
            <span class="status-pill" id="run-status">idle</span>
          </div>
          <dl class="run-facts" id="run-facts">
            <div><dt>Run</dt><dd>—</dd></div>
            <div><dt>Model</dt><dd>—</dd></div>
            <div><dt>Event</dt><dd>—</dd></div>
          </dl>
        </section>

        <section class="inspector-section approval-section" id="approval-section" aria-labelledby="approval-title" hidden>
          <div class="section-heading">
            <h3 id="approval-title">等待授权</h3>
            <span class="count-badge" id="approval-count">0</span>
          </div>
          <div id="approval-list"></div>
        </section>

        <section class="inspector-section activity-section" aria-labelledby="activity-title">
          <div class="section-heading">
            <h3 id="activity-title">活动</h3>
            <button class="quiet-button" id="clear-activity" type="button">清空</button>
          </div>
          <ol class="activity-list" id="activity-list">
            <li class="activity-empty">运行事件会显示在这里</li>
          </ol>
        </section>
      </aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <dialog class="session-dialog" id="session-dialog">
      <form method="dialog" id="session-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">SESSION</p>
            <h2 id="dialog-title">新建会话</h2>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <label>
          <span>标题</span>
          <input id="session-title-input" name="title" autocomplete="off" maxlength="120" placeholder="例如：梳理项目入口">
        </label>
        <label id="session-id-field">
          <span>Session ID <small>可选</small></span>
          <input id="session-id-input" name="sessionId" autocomplete="off" placeholder="留空自动生成">
        </label>
        <label id="workspace-field">
          <span>Workspace <small>可选</small></span>
          <input id="workspace-input" name="workspaceRoot" autocomplete="off" placeholder="使用服务端默认目录">
        </label>
        <p class="form-error" id="session-form-error" hidden></p>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel" type="submit">取消</button>
          <button class="primary-button" id="save-session" value="default" type="submit">创建</button>
        </div>
      </form>
    </dialog>

    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
