        activation: user
        constraint: !!js >-
          launch.environment.WISH_WEB_FETCH_TOOLS_ENABLED !== undefined &&
          launch.environment.WISH_WEB_FETCH_TOOLS_ENABLED !== '' &&
          launch.environment.WISH_WEB_FETCH_TOOLS_ENABLED !== '1'

